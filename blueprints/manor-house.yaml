name: manor-house
version: 1
description: >
  13x13 の 3 階建て + 屋上テラス。1 階に物置と風呂、2 階にキッチンとダイニング、
  3 階にベッドルーム、屋上にベンチと焚き火。各階は内部階段でつながる。
author: dobachi

anchor:
  description: 建物の北西角、1 階の床レベル（床ブロックそのものの高さ）

bounds:
  min: [0, -4, 0]
  max: [15, 17, 12]

preconditions:
  - 13x13 の敷地が要る。周囲の建造物と 4 ブロック以上離すこと
  - 地形の高低差は基礎（4 ブロック）で吸収できる範囲まで。それを超えるなら基礎を深くする
  - 入口は +X 側（東）。その方向に踏み段 3 マス分の余地が必要

# 階層構成（相対 y）
#   -4..-1  基礎（keep 充填）
#    0      1階 床
#    1..4   1階 内部（物置・風呂）
#    5      2階 床
#    6..9   2階 内部（キッチン・ダイニング）
#   10      3階 床
#   11..14  3階 内部（ベッドルーム）
#   15      屋上 床
#   16..17  屋上 柵と設備
#
# 階段はすべて x=10 の列を +Z 方向に上る。各階で同じ位置なので通し柱のように扱える。

steps:
  # ---------------------------------------------------------------- 躯体

  - name: 敷地クリア
    op: fill
    from: [0, 0, 0]
    to:   [12, 17, 12]
    block: minecraft:air
    mode: replace
    why: hollow は内部の既存ブロックに触れないので、建てる前に必ず空にする。

  - name: 基礎
    op: fill
    from: [0, -4, 0]
    to:   [12, -1, 12]
    block: minecraft:stone
    mode: replace
    why: >
      この敷地は南西が 3 ブロック低い窪地なので 4 ブロック取っている。

      starter-house と違い keep ではなく replace を使う。keep は「空気だけ」を埋める
      ため、窪地に葉や草（非固体ブロック）が残っていると素通りして 0 ブロックしか
      置かれない。実際この敷地では keep が 0 件を返した。
      基礎は地下で見えないので、既存地形ごと石にして問題ない。
      なお get_top_solid_block は非固体を無視するので、その結果だけ見て
      「空気だから keep で埋まる」と判断してはいけない。

  - name: 本体外殻
    op: cube
    from: [0, 0, 0]
    to:   [12, 15, 12]
    block: minecraft:oak_planks
    hollow: true
    why: 1 階の床から屋上の床までを一度に。中間階の床は個別に張る。

  - name: 1階の床（石張り）
    op: fill
    from: [1, 0, 1]
    to:   [11, 0, 11]
    block: minecraft:stone
    why: 風呂場を置くので水回りに合う石にする。階ごとに床材を変えて区別する。

  - name: 2階の床
    op: fill
    from: [1, 5, 1]
    to:   [11, 5, 11]
    block: minecraft:oak_planks

  - name: 3階の床
    op: fill
    from: [1, 10, 1]
    to:   [11, 10, 11]
    block: minecraft:dark_oak_planks

  - name: 屋上の床（石レンガ）
    op: fill
    from: [0, 15, 0]
    to:   [12, 15, 12]
    block: minecraft:stone_bricks
    why: 屋上を BBQ に使うので、燃えない材質にする。

  # ------------------------------------------------------------ 階段と吹抜

  - name: 階段の吹抜（2階の床を抜く）
    op: fill
    from: [10, 5, 2]
    to:   [10, 5, 5]
    block: minecraft:air
    mode: replace
    why: 階段を上りきる手前の床を抜かないと、頭がつかえて上がれない。

  - name: 階段の吹抜（3階の床を抜く）
    op: fill
    from: [10, 10, 2]
    to:   [10, 10, 5]
    block: minecraft:air
    mode: replace

  - name: 階段の吹抜（屋上の床を抜く）
    op: fill
    from: [10, 15, 2]
    to:   [10, 15, 5]
    block: minecraft:air
    mode: replace

  - name: 階段 1階→2階
    op: setblock
    at:
      - [10, 1, 2]
      - [10, 2, 3]
      - [10, 3, 4]
      - [10, 4, 5]
      - [10, 5, 6]
    block: oak_stairs
    state: '["weirdo_direction"=2,"upside_down_bit"=false]'
    why: >
      +Z（南）へ向かって 1 段ずつ上る。weirdo_direction は「高い側が向く方向」らしく、
      入口の踏み段（西向きに上る）が 1 だったことから南は 2 と推定している。
      実機で向きが逆なら 3 に変える。

  - name: 階段 2階→3階
    op: setblock
    at:
      - [10, 6, 2]
      - [10, 7, 3]
      - [10, 8, 4]
      - [10, 9, 5]
      - [10, 10, 6]
    block: oak_stairs
    state: '["weirdo_direction"=2,"upside_down_bit"=false]'

  - name: 階段 3階→屋上
    op: setblock
    at:
      - [10, 11, 2]
      - [10, 12, 3]
      - [10, 13, 4]
      - [10, 14, 5]
      - [10, 15, 6]
    block: oak_stairs
    state: '["weirdo_direction"=2,"upside_down_bit"=false]'

  # -------------------------------------------------------------- 角柱と窓

  - name: 角柱（北西）
    op: fill
    from: [0, 1, 0]
    to:   [0, 14, 0]
    block: minecraft:dark_oak_log

  - name: 角柱（北東）
    op: fill
    from: [12, 1, 0]
    to:   [12, 14, 0]
    block: minecraft:dark_oak_log

  - name: 角柱（南西）
    op: fill
    from: [0, 1, 12]
    to:   [0, 14, 12]
    block: minecraft:dark_oak_log

  - name: 角柱（南東）
    op: fill
    from: [12, 1, 12]
    to:   [12, 14, 12]
    block: minecraft:dark_oak_log

  - name: 窓 1階（北面）
    op: fill
    from: [3, 2, 0]
    to:   [9, 3, 0]
    block: minecraft:glass

  - name: 窓 1階（南面）
    op: fill
    from: [3, 2, 12]
    to:   [9, 3, 12]
    block: minecraft:glass

  - name: 窓 1階（西面）
    op: fill
    from: [0, 2, 3]
    to:   [0, 3, 9]
    block: minecraft:glass

  - name: 窓 2階（北面）
    op: fill
    from: [3, 7, 0]
    to:   [9, 8, 0]
    block: minecraft:glass

  - name: 窓 2階（南面）
    op: fill
    from: [3, 7, 12]
    to:   [9, 8, 12]
    block: minecraft:glass

  - name: 窓 2階（西面）
    op: fill
    from: [0, 7, 3]
    to:   [0, 8, 9]
    block: minecraft:glass

  - name: 窓 2階（東面）
    op: fill
    from: [12, 7, 8]
    to:   [12, 8, 10]
    block: minecraft:glass

  - name: 窓 3階（北面）
    op: fill
    from: [3, 12, 0]
    to:   [9, 13, 0]
    block: minecraft:glass

  - name: 窓 3階（南面）
    op: fill
    from: [3, 12, 12]
    to:   [9, 13, 12]
    block: minecraft:glass

  - name: 窓 3階（西面）
    op: fill
    from: [0, 12, 3]
    to:   [0, 13, 9]
    block: minecraft:glass

  - name: 窓 3階（東面）
    op: fill
    from: [12, 12, 8]
    to:   [12, 13, 10]
    block: minecraft:glass

  # ------------------------------------------------------------ 入口とドア

  - name: 出入口をくり抜く
    op: fill
    from: [12, 1, 5]
    to:   [12, 2, 6]
    block: minecraft:air
    mode: replace

  - name: ドア（北側・ヒンジ左）
    op: setblock
    raw: true
    at:
      - [12, 1, 5]
    block: wooden_door

  - name: ドア（南側・ヒンジ右）
    op: setblock
    at:
      - [12, 1, 6]
    block: wooden_door
    state: '["door_hinge_bit"=true]'
    why: 片方のヒンジを反転しないと観音開きにならない。

  - name: 入口の踏み段
    op: setblock
    at:
      - [13, 0, 5]
      - [13, 0, 6]
    block: oak_stairs
    state: '["weirdo_direction"=1,"upside_down_bit"=false]'
    why: >
      段数は敷地の地形で決まるので、ここは固定値にできない。
      この敷地では入口側の地表が床の 1 下だったため 1 段で足りた（当初 2 段で
      設計していたが、実測して減らした）。

      建てる前に必ず入口の外側を get_top_solid_block で測り、
      (床の y) - (地表の y) の段数を置くこと。多すぎると宙に浮き、
      少なすぎると 2 ブロック以上の段差になって入れなくなる。

  # ---------------------------------------------------------------- 照明

  - name: 照明 1階
    op: setblock
    at:
      - [3, 4, 3]
      - [8, 4, 3]
      - [3, 4, 9]
      - [8, 4, 9]
    block: minecraft:sea_lantern
    why: 天井に埋め込む。各階 4 基で 11x11 を湧き潰しできる明るさになる。

  - name: 照明 2階
    op: setblock
    at:
      - [3, 9, 3]
      - [8, 9, 3]
      - [3, 9, 9]
      - [8, 9, 9]
    block: minecraft:sea_lantern

  - name: 照明 3階
    op: setblock
    at:
      - [3, 14, 3]
      - [8, 14, 3]
      - [3, 14, 9]
      - [8, 14, 9]
    block: minecraft:sea_lantern

  # ------------------------------------------------------------ 屋上まわり

  - name: 屋上の柵（北）
    op: fill
    from: [0, 16, 0]
    to:   [12, 16, 0]
    block: minecraft:oak_fence

  - name: 屋上の柵（南）
    op: fill
    from: [0, 16, 12]
    to:   [12, 16, 12]
    block: minecraft:oak_fence

  - name: 屋上の柵（西）
    op: fill
    from: [0, 16, 1]
    to:   [0, 16, 11]
    block: minecraft:oak_fence

  - name: 屋上の柵（東）
    op: fill
    from: [12, 16, 1]
    to:   [12, 16, 11]
    block: minecraft:oak_fence
    why: >
      四辺を個別に fill する。outline モードを使うと単層では全面が埋まってしまう
      （屋上が柵で埋まる）。

  # ------------------------------------------------------------ 内装 1階

  - name: 物置のチェスト
    op: setblock
    at:
      - [2, 1, 2]
      - [3, 1, 2]
    block: minecraft:chest

  - name: 物置の樽
    op: setblock
    at:
      - [4, 1, 2]
      - [5, 1, 2]
    block: minecraft:barrel

  - name: 物置の本棚
    op: setblock
    at:
      - [2, 2, 2]
    block: minecraft:bookshelf

  - name: 浴槽の枠
    op: fill
    from: [3, 0, 7]
    to:   [6, 0, 11]
    block: minecraft:quartz_block
    why: 床を石英に差し替えて水回りらしくする。この内側に水を張る。

  - name: 浴槽の水
    op: fill
    from: [4, 0, 8]
    to:   [5, 0, 10]
    block: minecraft:water
    why: >
      床と同じ高さ（y=0）に水を置くことで、床に埋め込まれた浴槽になる。
      床の上（y=1）に置くと部屋が水浸しになるので高さを間違えないこと。

  # ------------------------------------------------------------ 内装 2階

  - name: キッチンのかまど
    op: setblock
    at:
      - [2, 6, 2]
      - [3, 6, 2]
    block: minecraft:furnace

  - name: キッチンの作業台
    op: setblock
    at:
      - [4, 6, 2]
    block: minecraft:crafting_table

  - name: キッチンの大釜
    op: setblock
    at:
      - [5, 6, 2]
    block: minecraft:cauldron

  - name: キッチンカウンター
    op: fill
    from: [6, 6, 2]
    to:   [8, 6, 2]
    block: minecraft:smooth_stone

  - name: ダイニングテーブル
    op: fill
    from: [4, 6, 8]
    to:   [6, 6, 8]
    block: minecraft:oak_planks

  - name: ダイニングの椅子（西側）
    op: setblock
    at:
      - [3, 6, 8]
    block: oak_stairs
    state: '["weirdo_direction"=1,"upside_down_bit"=false]'
    why: 階段ブロックを椅子に使う。座面がテーブルを向くよう向きを決める。

  - name: ダイニングの椅子（東側）
    op: setblock
    at:
      - [7, 6, 8]
    block: oak_stairs
    state: '["weirdo_direction"=0,"upside_down_bit"=false]'

  # ------------------------------------------------------------ 内装 3階

  - name: ベッド
    op: setblock
    raw: true
    at:
      - [3, 11, 3]
    block: bed
    why: >
      ドアと同じく、片方を置けばもう一方（足側）は自動生成される。
      名前空間を付けない bed で通る。

  - name: ナイトテーブル
    op: setblock
    at:
      - [4, 11, 3]
    block: minecraft:crafting_table

  - name: 寝室のチェスト
    op: setblock
    at:
      - [5, 11, 3]
    block: minecraft:chest

  - name: 寝室の本棚
    op: setblock
    at:
      - [7, 11, 3]
    block: minecraft:bookshelf

  # -------------------------------------------------------------- 屋上設備

  - name: 屋上のベンチ
    op: setblock
    at:
      - [3, 16, 3]
      - [4, 16, 3]
      - [5, 16, 3]
    block: oak_stairs
    state: '["weirdo_direction"=2,"upside_down_bit"=false]'

  - name: BBQ の焚き火
    op: setblock
    at:
      - [7, 16, 6]
    block: minecraft:campfire
    why: >
      屋上の床を stone_bricks にしてあるのは、焚き火の周囲を燃えない材質に
      するため。木材の上に置くと延焼のリスクがある。

  - name: 屋上のテーブル
    op: setblock
    at:
      - [5, 16, 7]
    block: minecraft:oak_planks

todo:
  - >
    傾斜屋根は断念した。屋上を BBQ に使うには平らである必要があり両立しない。
    輪郭を締める役割は屋上の柵と四隅の通し柱に担わせている。
  - >
    内部階段の weirdo_direction=2 は推定値。実機で逆を向いていたら 3 に直し、
    この why: と docs/PITFALLS.md の方角対応表を更新すること。
