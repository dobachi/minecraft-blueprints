name: manor-house
version: 1
description: >
  13x13 の 3 階建て + 屋上テラス。1 階に物置と風呂、2 階にキッチンとダイニング、
  3 階にベッドルーム、屋上にベンチと焚き火。各階は内部階段でつながる。
author: dobachi

anchor:
  description: 建物の北西角、1 階の床レベル（床ブロックそのものの高さ）

bounds:
  min: [0, -4, 0]
  max: [15, 17, 12]

preconditions:
  - 13x13 の敷地が要る。周囲の建造物と 4 ブロック以上離すこと
  - 地形の高低差は基礎（4 ブロック）で吸収できる範囲まで。それを超えるなら基礎を深くする
  - 入口は +X 側（東）。その方向に踏み段 3 マス分の余地が必要

# 階層構成（相対 y）
#   -4..-1  基礎（keep 充填）
#    0      1階 床
#    1..4   1階 内部（物置・風呂）
#    5      2階 床
#    6..9   2階 内部（キッチン・ダイニング）
#   10      3階 床
#   11..14  3階 内部（ベッドルーム）
#   15      屋上 床
#   16..17  屋上 柵と設備
#
# 階段はすべて x=10 の列を +Z 方向に上る。各階で同じ位置なので通し柱のように扱える。

steps:
  # ---------------------------------------------------------------- 躯体

  - name: 敷地クリア
    op: fill
    from: [0, 0, 0]
    to:   [12, 17, 12]
    block: minecraft:air
    mode: replace
    why: hollow は内部の既存ブロックに触れないので、建てる前に必ず空にする。

  - name: 基礎
    op: fill
    from: [0, -4, 0]
    to:   [12, -1, 12]
    block: minecraft:stone
    mode: replace
    why: >
      この敷地は南西が 3 ブロック低い窪地なので 4 ブロック取っている。

      starter-house と違い keep ではなく replace を使う。keep は「空気だけ」を埋める
      ため、窪地に葉や草（非固体ブロック）が残っていると素通りして 0 ブロックしか
      置かれない。実際この敷地では keep が 0 件を返した。
      基礎は地下で見えないので、既存地形ごと石にして問題ない。
      なお get_top_solid_block は非固体を無視するので、その結果だけ見て
      「空気だから keep で埋まる」と判断してはいけない。

  - name: 本体外殻
    op: cube
    from: [0, 0, 0]
    to:   [12, 15, 12]
    block: minecraft:oak_planks
    hollow: true
    why: 1 階の床から屋上の床までを一度に。中間階の床は個別に張る。

  - name: 1階の床（石張り）
    op: fill
    from: [1, 0, 1]
    to:   [11, 0, 11]
    block: minecraft:stone
    why: 風呂場を置くので水回りに合う石にする。階ごとに床材を変えて区別する。

  - name: 2階の床
    op: fill
    from: [1, 5, 1]
    to:   [11, 5, 11]
    block: minecraft:oak_planks

  - name: 3階の床
    op: fill
    from: [1, 10, 1]
    to:   [11, 10, 11]
    block: minecraft:dark_oak_planks

  - name: 屋上の床（石レンガ）
    op: fill
    from: [0, 15, 0]
    to:   [12, 15, 12]
    block: minecraft:stone_bricks
    why: 屋上を BBQ に使うので、燃えない材質にする。

  # ------------------------------------------------------------ 階段と吹抜

  - name: 階段の吹抜（2階の床を抜く）
    op: fill
    from: [2, 5, 2]
    to:   [5, 5, 2]
    block: minecraft:air
    mode: replace
    why: >
      階段を上りきる手前の床を抜かないと、頭がつかえて上がれない。

      階段は北西の奥に置く。入口（北東）の正面に階段を置くと、玄関から直に
      階上へ抜ける動線になり、居室がただの通路になってしまうため。

      向きは +X（東）。最初は +Z（南）に上げていたが、そうすると最下段が
      北壁に接してしまい、正面から乗れず横から回り込む羽目になった。
      階段の向きは「奥に置けるか」だけでなく「最下段の手前に立つ余地があるか」
      で決めること。東向きなら x=1 の列が踏み込みスペースになる。

  - name: 階段の吹抜（3階の床を抜く）
    op: fill
    from: [2, 10, 2]
    to:   [5, 10, 2]
    block: minecraft:air
    mode: replace

  - name: 階段の吹抜（屋上の床を抜く）
    op: fill
    from: [2, 15, 2]
    to:   [5, 15, 2]
    block: minecraft:air
    mode: replace

  - name: 階段 1階→2階
    op: setblock
    at:
      - [2, 1, 2]
      - [3, 2, 2]
      - [4, 3, 2]
      - [5, 4, 2]
      - [6, 5, 2]
    block: oak_stairs
    state: '["weirdo_direction"=0,"upside_down_bit"=false]'
    why: >
      +Z（南）へ向かって 1 段ずつ上る。weirdo_direction は「高い側が向く方向」らしく、
      入口の踏み段（西向きに上る）が 1 だったことから南は 2 と推定している。
      実機で向きが逆なら 3 に変える。

  - name: 階段 2階→3階
    op: setblock
    at:
      - [2, 6, 1]
      - [2, 7, 2]
      - [2, 8, 3]
      - [2, 9, 4]
      - [2, 10, 5]
    block: oak_stairs
    state: '["weirdo_direction"=2,"upside_down_bit"=false]'

  - name: 階段 3階→屋上
    op: setblock
    at:
      - [2, 11, 1]
      - [2, 12, 2]
      - [2, 13, 3]
      - [2, 14, 4]
      - [2, 15, 5]
    block: oak_stairs
    state: '["weirdo_direction"=2,"upside_down_bit"=false]'

  # -------------------------------------------------------------- 角柱と窓

  - name: 角柱（北西）
    op: fill
    from: [0, 1, 0]
    to:   [0, 14, 0]
    block: minecraft:dark_oak_log

  - name: 角柱（北東）
    op: fill
    from: [12, 1, 0]
    to:   [12, 14, 0]
    block: minecraft:dark_oak_log

  - name: 角柱（南西）
    op: fill
    from: [0, 1, 12]
    to:   [0, 14, 12]
    block: minecraft:dark_oak_log

  - name: 角柱（南東）
    op: fill
    from: [12, 1, 12]
    to:   [12, 14, 12]
    block: minecraft:dark_oak_log

  - name: 窓 1階（北面）
    op: fill
    from: [3, 2, 0]
    to:   [9, 3, 0]
    block: minecraft:glass

  - name: 窓 1階（南面）
    op: fill
    from: [3, 2, 12]
    to:   [9, 3, 12]
    block: minecraft:glass

  - name: 窓 1階（西面）
    op: fill
    from: [0, 2, 3]
    to:   [0, 3, 9]
    block: minecraft:glass

  - name: 窓 2階（北面）
    op: fill
    from: [3, 7, 0]
    to:   [9, 8, 0]
    block: minecraft:glass

  - name: 窓 2階（南面）
    op: fill
    from: [3, 7, 12]
    to:   [9, 8, 12]
    block: minecraft:glass

  - name: 窓 2階（西面）
    op: fill
    from: [0, 7, 3]
    to:   [0, 8, 9]
    block: minecraft:glass

  - name: 窓 2階（東面）
    op: fill
    from: [12, 7, 8]
    to:   [12, 8, 10]
    block: minecraft:glass

  - name: 窓 3階（北面）
    op: fill
    from: [3, 12, 0]
    to:   [9, 13, 0]
    block: minecraft:glass

  - name: 窓 3階（南面）
    op: fill
    from: [3, 12, 12]
    to:   [9, 13, 12]
    block: minecraft:glass

  - name: 窓 3階（西面）
    op: fill
    from: [0, 12, 3]
    to:   [0, 13, 9]
    block: minecraft:glass

  - name: 窓 3階（東面）
    op: fill
    from: [12, 12, 8]
    to:   [12, 13, 10]
    block: minecraft:glass

  # ------------------------------------------------------------ 入口とドア

  - name: 出入口をくり抜く
    op: fill
    from: [12, 1, 2]
    to:   [12, 2, 3]
    block: minecraft:air
    mode: replace
    why: >
      入口は北東に寄せる。中央（z=5,6）に置くと、1 階を南北に仕切る壁（z=6）の
      延長線上に玄関が来てしまい、入った正面が壁の切れ目になって落ち着かない。

  - name: ドア（北側・ヒンジ左）
    op: setblock
    raw: true
    at:
      - [12, 1, 2]
    block: wooden_door

  - name: ドア（南側・ヒンジ右）
    op: setblock
    at:
      - [12, 1, 3]
    block: wooden_door
    state: '["door_hinge_bit"=true]'
    why: 片方のヒンジを反転しないと観音開きにならない。

  - name: 入口の踏み段
    op: setblock
    at:
      - [13, 0, 2]
      - [13, 0, 3]
    block: oak_stairs
    state: '["weirdo_direction"=1,"upside_down_bit"=false]'
    why: >
      段数は敷地の地形で決まるので、ここは固定値にできない。
      この敷地では入口側の地表が床の 1 下だったため 1 段で足りた（当初 2 段で
      設計していたが、実測して減らした）。

      建てる前に必ず入口の外側を get_top_solid_block で測り、
      (床の y) - (地表の y) の段数を置くこと。多すぎると宙に浮き、
      少なすぎると 2 ブロック以上の段差になって入れなくなる。

  # ---------------------------------------------------------------- 照明

  - name: 照明 1階
    op: setblock
    at:
      - [3, 4, 3]
      - [8, 4, 3]
      - [3, 4, 9]
      - [8, 4, 9]
    block: minecraft:sea_lantern
    why: 天井に埋め込む。各階 4 基で 11x11 を湧き潰しできる明るさになる。

  - name: 照明 2階
    op: setblock
    at:
      - [3, 9, 3]
      - [8, 9, 3]
      - [3, 9, 9]
      - [8, 9, 9]
    block: minecraft:sea_lantern

  - name: 照明 3階
    op: setblock
    at:
      - [3, 14, 3]
      - [8, 14, 3]
      - [3, 14, 9]
      - [8, 14, 9]
    block: minecraft:sea_lantern

  # ------------------------------------------------------------ 屋上まわり

  - name: 屋上の柵（北）
    op: fill
    from: [0, 16, 0]
    to:   [12, 16, 0]
    block: minecraft:oak_fence

  - name: 屋上の柵（南）
    op: fill
    from: [0, 16, 12]
    to:   [12, 16, 12]
    block: minecraft:oak_fence

  - name: 屋上の柵（西）
    op: fill
    from: [0, 16, 1]
    to:   [0, 16, 11]
    block: minecraft:oak_fence

  - name: 屋上の柵（東）
    op: fill
    from: [12, 16, 1]
    to:   [12, 16, 11]
    block: minecraft:oak_fence
    why: >
      四辺を個別に fill する。outline モードを使うと単層では全面が埋まってしまう
      （屋上が柵で埋まる）。

  # ------------------------------------------------------------ 内装 1階

  - name: 物置のチェスト
    op: setblock
    at:
      - [5, 1, 1]
      - [6, 1, 1]
    block: minecraft:chest
    why: >
      北の壁際に寄せる。階段が x=2 の列を占有するので、家具は x=5 以降に置く
      （階段を動かしたときに座標が衝突しやすいのはこの列）。

  - name: 物置の樽
    op: setblock
    at:
      - [7, 1, 1]
      - [8, 1, 1]
    block: minecraft:barrel

  - name: 物置の本棚
    op: setblock
    at:
      - [5, 2, 1]
    block: minecraft:bookshelf

  - name: 浴槽の枠
    op: fill
    from: [3, 0, 7]
    to:   [6, 0, 11]
    block: minecraft:quartz_block
    why: 床を石英に差し替えて水回りらしくする。この内側に水を張る。

  - name: 浴槽の水
    op: fill
    from: [4, 0, 8]
    to:   [5, 0, 10]
    block: minecraft:water
    why: >
      床と同じ高さ（y=0）に水を置くことで、床に埋め込まれた浴槽になる。
      床の上（y=1）に置くと部屋が水浸しになるので高さを間違えないこと。

  - name: 浴槽の縁（北）
    op: fill
    from: [3, 1, 7]
    to:   [6, 1, 7]
    block: minecraft:quartz_block
    why: >
      縁を 1 段立ち上げないと、ただ床に水たまりがあるようにしか見えない。
      水面の高さは変えず、周囲だけを囲うのが浴槽らしく見せるコツ。

  - name: 浴槽の縁（南）
    op: fill
    from: [3, 1, 11]
    to:   [6, 1, 11]
    block: minecraft:quartz_block

  - name: 浴槽の縁（西）
    op: fill
    from: [3, 1, 8]
    to:   [3, 1, 10]
    block: minecraft:quartz_block

  - name: 浴槽の縁（東）
    op: fill
    from: [6, 1, 8]
    to:   [6, 1, 10]
    block: minecraft:quartz_block

  - name: 風呂場の間仕切り
    op: fill
    from: [1, 1, 6]
    to:   [11, 4, 6]
    block: minecraft:oak_planks
    why: >
      物置と地続きだと浴室に見えない。1 階を南北に仕切って独立した部屋にする。

      内部の幅いっぱい（x=1..11）を塞ぎ、出入りはドア 1 箇所に限る。
      以前は階段が東側にあった名残で x=9 までしか塞いでおらず、east 端に
      幅 2 の抜けが残っていた。階段を西へ移した時点でその抜けは意味を失い、
      ドアと合わせて通路が二重になっていた。
      仕切りを部分的に開けるときは「なぜ開けるのか」を必ず書くこと。

  - name: 風呂場の入口をくり抜く
    op: fill
    from: [8, 1, 6]
    to:   [8, 2, 6]
    block: minecraft:air
    mode: replace

  - name: 風呂場のドア
    op: setblock
    raw: true
    at:
      - [8, 1, 6]
    block: wooden_door

  # ------------------------------------------------------------ 内装 2階

  - name: キッチンのかまど
    op: setblock
    at:
      - [8, 6, 1]
      - [9, 6, 1]
    block: minecraft:furnace
    why: >
      東の壁際にまとめる。階段は x=2..6 の列を上がって x=6 に着地するので、
      設備を x=5 あたりに置くと上がった正面が調理台になり、吹抜の縁に
      かまどが並ぶ形になる。着地点から離すこと。

  - name: キッチンの作業台
    op: setblock
    at:
      - [10, 6, 1]
    block: minecraft:crafting_table

  - name: キッチンの大釜
    op: setblock
    at:
      - [11, 6, 1]
    block: minecraft:cauldron

  - name: キッチンカウンター
    op: fill
    from: [11, 6, 2]
    to:   [11, 6, 4]
    block: minecraft:smooth_stone
    why: 東壁に沿って L 字に折り返す。

  - name: ダイニングのカーペット
    op: fill
    from: [3, 6, 6]
    to:   [7, 6, 10]
    block: minecraft:red_carpet
    why: >
      2 階は仕切りがなくキッチンと地続きなので、床材でダイニングのゾーンを分ける。
      必ず家具より先に敷くこと。後から敷くとテーブルや椅子を上書きしてしまう。

  - name: ダイニングテーブル
    op: fill
    from: [4, 6, 8]
    to:   [6, 6, 8]
    block: minecraft:oak_planks

  - name: ダイニングの椅子（西）
    op: setblock
    at:
      - [3, 6, 8]
    block: oak_stairs
    state: '["weirdo_direction"=1,"upside_down_bit"=false]'
    why: >
      階段ブロックを椅子にする。背もたれ（高い側）が外を向くように置く。
      weirdo_direction は「高い側が向く方角」で 0=東 1=西 2=南 3=北。
      4 方向すべて実機で確認済み。

  - name: ダイニングの椅子（東）
    op: setblock
    at:
      - [7, 6, 8]
    block: oak_stairs
    state: '["weirdo_direction"=0,"upside_down_bit"=false]'

  - name: ダイニングの椅子（北）
    op: setblock
    at:
      - [5, 6, 7]
    block: oak_stairs
    state: '["weirdo_direction"=3,"upside_down_bit"=false]'

  - name: ダイニングの椅子（南）
    op: setblock
    at:
      - [5, 6, 9]
    block: oak_stairs
    state: '["weirdo_direction"=2,"upside_down_bit"=false]'

  - name: テーブルのケーキ
    op: setblock
    at:
      - [5, 7, 8]
    block: minecraft:cake
    why: 天板の上に 1 つ置くだけで食卓に見える。

  - name: 吊り下げ照明の鎖
    op: setblock
    at:
      - [5, 9, 8]
    block: minecraft:chain

  - name: 吊り下げ照明のランタン
    op: setblock
    at:
      - [5, 8, 8]
    block: lantern
    state: '["hanging"=true]'
    why: >
      hanging=true を付けないと床置きの形になる。天井に埋めたシーランタンだけでは
      光源が意匠にならないので、テーブル上に吊るして視線の中心をつくる。

  - name: 窓辺の鉢植え
    op: setblock
    at:
      - [3, 6, 11]
      - [7, 6, 11]
    block: minecraft:flower_pot

  - name: ダイニングの樽
    op: setblock
    at:
      - [9, 6, 10]
    block: minecraft:barrel

  # ------------------------------------------------------------ 内装 3階

  - name: 3階の間仕切り（寝室と書斎）
    op: fill
    from: [1, 11, 6]
    to:   [11, 14, 6]
    block: minecraft:oak_planks
    why: >
      1 階と同じ z=6 で仕切り、北を寝室、南を書斎にする。
      1 階の間仕切りと同じく内部の幅いっぱいを塞ぎ、出入りは x=8 のドアだけにする。

  - name: 3階の間仕切りの入口
    op: fill
    from: [8, 11, 6]
    to:   [8, 12, 6]
    block: minecraft:air
    mode: replace

  - name: 書斎のドア
    op: setblock
    raw: true
    at:
      - [8, 11, 6]
    block: wooden_door

  - name: ベッド3台
    op: setblock
    raw: true
    at:
      - [4, 11, 4]
      - [6, 11, 4]
      - [8, 11, 4]
    block: bed
    why: >
      ドアと同じく、片方を置けばもう一方（足側）は自動生成される。
      名前空間を付けない bed で通る。足側は −Z（北）へ伸びるので、
      z=4 に置くと z=3 までを占める。

      1 台が 2 ブロックを占めるので x を 2 つおきにする。詰めて置くと
      隣のベッドの足側と衝突して片方が壊れる。

      z=2 の列には置かないこと。そこは階段の吹抜と着地点で、置くと
      床のない吹抜の上にベッドが浮き、さらに階段を上りきった所を塞ぐ。

  - name: 寝室のチェスト
    op: setblock
    at:
      - [3, 11, 5]
      - [5, 11, 5]
    block: minecraft:chest

  - name: 書斎の本棚（下段）
    op: fill
    from: [1, 11, 10]
    to:   [4, 11, 10]
    block: minecraft:bookshelf

  - name: 書斎の本棚（上段）
    op: fill
    from: [1, 12, 10]
    to:   [4, 12, 10]
    block: minecraft:bookshelf
    why: 2 段積むと書架らしい壁面になる。1 段だけだと腰高の棚に見えて締まらない。

  - name: 書斎の机
    op: setblock
    at:
      - [6, 11, 9]
      - [7, 11, 9]
    block: minecraft:crafting_table

  - name: 書斎の椅子
    op: setblock
    at:
      - [6, 11, 8]
    block: oak_stairs
    state: '["weirdo_direction"=2,"upside_down_bit"=false]'
    why: 机（z=9）に向かうよう南向きに置く。

  # -------------------------------------------------------------- 屋上設備

  - name: 屋上の吹抜まわりの手すり（北）
    op: fill
    from: [2, 16, 1]
    to:   [5, 16, 1]
    block: minecraft:oak_fence
    why: >
      屋上の吹抜は床に開いた穴なので、囲わないと 3 階まで落ちる。外周の柵だけでは
      足りない。階段が上がってくる東側（x=6）は出入口として開けておく。

  - name: 屋上の吹抜まわりの手すり（南）
    op: fill
    from: [2, 16, 3]
    to:   [5, 16, 3]
    block: minecraft:oak_fence

  - name: 屋上の吹抜まわりの手すり（西）
    op: setblock
    at:
      - [1, 16, 2]
    block: minecraft:oak_fence

  - name: 屋上のベンチ
    op: setblock
    at:
      - [6, 16, 7]
      - [7, 16, 7]
      - [8, 16, 7]
    block: oak_stairs
    state: '["weirdo_direction"=2,"upside_down_bit"=false]'
    why: >
      焚き火（z=6）の南側に、火の方を向けて並べる。
      当初は吹抜の縁（z=3）に置いていたが、座った背後が穴になるので移した。

  - name: BBQ の焚き火
    op: setblock
    at:
      - [7, 16, 6]
    block: minecraft:campfire
    why: >
      屋上の床を stone_bricks にしてあるのは、焚き火の周囲を燃えない材質に
      するため。木材の上に置くと延焼のリスクがある。

  - name: 屋上のテーブル
    op: setblock
    at:
      - [5, 16, 7]
    block: minecraft:oak_planks

