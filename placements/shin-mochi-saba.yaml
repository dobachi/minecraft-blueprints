# 「どこに建てたか」の記録。
#
# blueprints/ が絶対座標を持たない（どのワールドにも持ち出せる設計図）のに対し、
# ここには絶対座標を書く。役割が逆なので、混ぜないこと。

world:
  name: 新もち鯖
  slug: shin-mochi-saba
  note: >
    socket-be が返すワールド名は "World #0" で、これは接続順に振られる内部ラベル。
    実際のワールド名ではなく、別のワールドに繋いでも同じ名前になりうる。
    Bedrock には Java の /seed に当たるコマンドがなく、world get_world_info も
    スポーン地点を返さないため、**機械的にワールドを同定する手段はない**。
    実質的な指紋は「その座標に行けば実際に建物がある」ことだけ。

placements:
  - blueprint: cat-house
    version: 1
    anchor: [133, 127, -139]
    anchor_description: 建物の北西角、1 階の床レベル
    built: 2026-09-05        # ゲーム内 24 日目の朝に着工、同日 27 日目に家具まで完了
    by: SeaGosling63244
    terrain: 地表は Y127 の草ブロック。4 隅とも同じ高さで平坦だった
    notes: >
      手なずけた猫が住んでいる。3 階の家具は Another Furniture Add-On 版
      （sf_afm:sofa_0.block / sf_afm:table_*.block）。

      実機ではソファ 3 つのうち真ん中をプレイヤーが手で置き、両隣を clone で複製した。
      テーブルは色を確かめずに table_11 を置いてある（末尾は木材の色なので、
      オークの躯体に合わせるなら 0 が正しい）。ブループリント側は 0 に直してある。

      1 階の床（5x5 の草ブロック）は建築で板に置き換わっている。

      3 階の家具はその後こうなっている（2026-09-06 時点）。

        X134-136 Y136 Z-138   ソファ 3 つ  sf_afm:sofa_0.block
        X135     Y136 Z-137   テーブル     sf_afm:table_11.block
        X135     Y137 Z-137   白いろうそく minecraft:white_candle ["lit"=true]

      ろうそくは「お茶を用意して」という依頼への代用。この世界には茶器に
      当たるブロックが無く、sf_afm にも cup / teapot / kettle は存在しない
      （いずれも構文エラーで確認済み）。最初は decorated_pot を茶壷に
      見立てて置いたが、依頼によりろうそくへ差し替えた。
